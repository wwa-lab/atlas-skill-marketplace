name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21.0.8
          cache: maven
      - run: ./mvnw verify
        working-directory: services/registry-api

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/marketplace-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/marketplace-web
      - run: pnpm lint
        working-directory: apps/marketplace-web
      - run: pnpm typecheck
        working-directory: apps/marketplace-web
      - run: pnpm test
        working-directory: apps/marketplace-web
      - run: pnpm build
        working-directory: apps/marketplace-web
