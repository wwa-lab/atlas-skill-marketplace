spring:
  datasource:
    url: jdbc:h2:file:./data/atlas;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    locations: classpath:db/migration,classpath:db/local
    placeholders:
      bigint_type: BIGINT
atlas:
  local-fixtures-enabled: true
